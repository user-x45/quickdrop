<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickDrop ― 同じ場所で、ファイルを渡す</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  :root {
    --bg: #0F1512;
    --panel: #161F1B;
    --panel-raised: #1D2924;
    --accent: #7FE0B5;
    --accent-dim: #4E8F72;
    --text: #EAF2ED;
    --sub: #8FA69A;
    --warn: #E0947F;
    --line: #253128;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", sans-serif;
    height: 100%;
    overflow: hidden;
  }

  body {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    flex-shrink: 0;
    padding: 20px 24px 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  header h1 {
    font-size: 30px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }

  header p {
    margin: 0;
    color: var(--sub);
    font-size: 16px;
    line-height: 1.6;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-size: 15px;
    color: var(--sub);
    flex-wrap: wrap;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--warn);
    transition: background 0.4s ease;
  }

  .status-dot.connected {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .you-name {
    color: var(--accent);
    font-weight: 500;
  }

  main {
    flex: 1 1 0;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 20px;
  }

  #field {
    position: relative;
    width: 100%;
    max-width: 620px;
    height: 100%;
    max-height: 460px;
  }

  .empty-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--sub);
    font-size: 18px;
    line-height: 1.9;
    padding: 0 16px;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .peer-node {
    position: absolute;
    width: 128px;
    height: 128px;
    margin-left: -64px;
    margin-top: -64px;
    border-radius: 50%;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    animation: drift 6s ease-in-out infinite, fade-in 0.5s ease;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .peer-node:hover {
    transform: scale(1.08);
    border-color: var(--accent-dim);
    box-shadow: 0 0 24px rgba(127, 224, 181, 0.15);
  }

  .peer-node.leaving {
    animation: fade-out 0.4s ease forwards;
  }

  .peer-node .glow {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
  }

  .peer-node .peer-name {
    font-size: 16px;
    font-weight: 500;
    text-align: center;
    padding: 0 4px;
    line-height: 1.3;
    white-space: nowrap;
  }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(0, -10px); }
  }

  .peer-node:hover { animation-play-state: paused; }

  @keyframes fade-in {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes fade-out {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(0.6); }
  }

  #log {
    flex-shrink: 0;
    max-width: 620px;
    margin: 0 auto;
    width: 100%;
    max-height: 200px;
    overflow-y: auto;
    padding: 0 24px 16px;
    overscroll-behavior: contain;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #log:empty {
    display: none;
  }

  .log-title {
    font-size: 15px;
    color: var(--sub);
    margin: 4px 0;
  }

  .transfer-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    animation: fade-in 0.4s ease;
  }

  .transfer-icon {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: var(--panel-raised);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--accent);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .transfer-icon img,
  .transfer-icon video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: var(--panel-raised);
  }

  .transfer-icon .badge {
    position: absolute;
    right: 3px;
    bottom: 3px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(15, 21, 18, 0.72);
    color: var(--text);
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 1px;
  }

  .transfer-info {
    flex: 1;
    min-width: 0;
  }

  .transfer-info .fname {
    font-size: 17px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .transfer-info .fmeta {
    font-size: 14px;
    color: var(--sub);
    margin-top: 2px;
  }

  .progress-track {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.15s ease;
  }

  .dl-btn {
    background: var(--accent);
    color: #0F1512;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: opacity 0.2s ease;
  }

  .dl-btn:hover { opacity: 0.85; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 21, 18, 0.72);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .sheet {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 24px 24px 32px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
    border-top: 1px solid var(--line);
  }

  .overlay.open .sheet {
    transform: translateY(0);
  }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 0 auto 18px;
  }

  .sheet h2 {
    font-size: 22px;
    margin: 0 0 6px;
    font-weight: 700;
    line-height: 1.4;
  }

  .sheet .to-name {
    color: var(--accent);
  }

  .sheet p.desc {
    color: var(--sub);
    font-size: 16px;
    margin: 0 0 18px;
  }

  .drop-zone {
    border: 1.5px dashed var(--line);
    border-radius: 16px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent-dim);
    background: var(--panel-raised);
  }

  .drop-zone .dz-icon {
    font-size: 36px;
    margin-bottom: 10px;
    color: var(--accent);
  }

  .drop-zone .dz-text {
    font-size: 18px;
    color: var(--text);
  }

  .drop-zone .dz-sub {
    font-size: 15px;
    color: var(--sub);
    margin-top: 4px;
  }

  .sheet-close {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: none;
    color: var(--sub);
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
  }

  input[type=file] { display: none; }

  @media (max-width: 480px) {
    header { padding: 14px 18px 2px; }
    header h1 { font-size: 26px; }
    header p { font-size: 14px; line-height: 1.5; }
    .status-row { font-size: 14px; margin-top: 6px; }
    .empty-hint { font-size: 16px; }
    .peer-node { width: 108px; height: 108px; margin-left: -54px; margin-top: -54px; }
    .peer-node .peer-name { font-size: 14px; }
  }

  @media (max-height: 640px) {
    header p { display: none; }
    header { padding-top: 12px; }
    #log { max-height: 150px; }
  }
</style>
</head>
<body>

<header>
  <h1>QuickDrop</h1>
  <p>このページを開いている、同じネットワーク内の端末が浮かび上がります。選んで、そのままファイルを送れます。</p>
  <div class="status-row">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">接続しています…</span>
    <span>／ あなたはこの場では</span>
    <span class="you-name" id="youName">—</span>
  </div>
</header>

<main>
  <div id="field">
    <div class="empty-hint" id="emptyHint">まだ誰もいません。<br>同じWi-Fiの端末でこのページを開くと、ここに現れます。</div>
  </div>
</main>

<div id="log"></div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2><span class="to-name" id="sheetToName" style="white-space:nowrap">端末</span><span style="white-space:nowrap">にファイルを送る</span></h2>
    <p class="desc">画像・動画・PDFなど、ファイルの種類は問いません。</p>
    <div class="drop-zone" id="dropZone">
      <div class="dz-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
      <div class="dz-text">タップしてファイルを選ぶ</div>
      <div class="dz-sub">またはここにドラッグ＆ドロップ</div>
    </div>
    <input type="file" id="fileInput">
    <button class="sheet-close" id="sheetClose">閉じる</button>
  </div>
</div>

<script>
const SIGNALING_URL = (() => {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return proto + "//quick-drop.user-x45.workers.dev/ws";
})();

const CHUNK_SIZE = 16 * 1024;

const ADJECTIVE_LIST = [
  "静かな", "素早い", "明るい", "涼しい", "温かい", "小さな", "大きな", "遠い",
  "近い", "澄んだ", "柔らかい", "鋭い", "陽気な", "穏やかな", "軽やかな", "力強い"
];

let ws = null;
let myId = null;
let myName = null;
const peers = new Map();
const peerNodeEls = new Map();
let activeTargetId = null;

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const youNameEl = document.getElementById("youName");
const field = document.getElementById("field");
const emptyHint = document.getElementById("emptyHint");
const logEl = document.getElementById("log");
const overlay = document.getElementById("overlay");
const sheetToName = document.getElementById("sheetToName");
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const sheetClose = document.getElementById("sheetClose");

function connect() {
  ws = new WebSocket(SIGNALING_URL);

  ws.addEventListener("open", () => {
    statusDot.classList.add("connected");
    statusText.textContent = "接続中";
  });

  ws.addEventListener("close", () => {
    statusDot.classList.remove("connected");
    statusText.textContent = "切断されました。再接続しています…";
    setTimeout(connect, 2000);
  });

  ws.addEventListener("error", () => {
    ws.close();
  });

  ws.addEventListener("message", (event) => {
    const data = JSON.parse(event.data);
    handleSignalingMessage(data);
  });
}

function handleSignalingMessage(data) {
  if (data.type === "welcome") {
    myId = data.id;
    myName = data.name;
    youNameEl.textContent = myName;
  } else if (data.type === "peer-list") {
    data.peers.forEach((p) => addPeer(p.id, p.name));
  } else if (data.type === "peer-joined") {
    addPeer(data.id, data.name);
  } else if (data.type === "peer-left") {
    removePeer(data.id);
  } else if (data.type === "signal") {
    handlePeerSignal(data.from, data.fromName, data.payload);
  }
}

function addPeer(id, name) {
  if (peers.has(id)) return;
  peers.set(id, { id, name });
  renderPeerNode(id, name);
  emptyHint.style.display = "none";
}

function removePeer(id) {
  peers.delete(id);
  const el = peerNodeEls.get(id);
  if (el) {
    el.classList.add("leaving");
    setTimeout(() => el.remove(), 400);
    peerNodeEls.delete(id);
  }
  if (peers.size === 0) {
    emptyHint.style.display = "flex";
  }
  const conn = connections.get(id);
  if (conn) {
    conn.pc.close();
    connections.delete(id);
  }
}

function nodeSize() {
  return window.innerWidth <= 480 ? 108 : 128;
}

function pickPosition() {
  const size = nodeSize();
  const half = size / 2;
  const w = field.clientWidth || 560;
  const h = field.clientHeight || 420;
  const minX = half + 6;
  const maxX = Math.max(w - half - 6, minX);
  const minY = half + 14;
  const maxY = Math.max(h - half - 14, minY);
  const minDist = size + 8;

  let best = null;
  let bestScore = -1;
  for (let i = 0; i < 40; i++) {
    const x = minX + Math.random() * (maxX - minX);
    const y = minY + Math.random() * (maxY - minY);
    let nearest = Infinity;
    peerNodeEls.forEach((other) => {
      const ox = parseFloat(other.style.left);
      const oy = parseFloat(other.style.top);
      nearest = Math.min(nearest, Math.hypot(x - ox, y - oy));
    });
    if (nearest >= minDist) return { x, y };
    if (nearest > bestScore) {
      bestScore = nearest;
      best = { x, y };
    }
  }
  return best;
}

function renderPeerNode(id, name) {
  const el = document.createElement("div");
  el.className = "peer-node";
  const pos = pickPosition();
  el.style.left = pos.x + "px";
  el.style.top = pos.y + "px";
  el.style.animationDelay = (Math.random() * 3) + "s";
  el.innerHTML = '<div class="glow"></div><div class="peer-name"></div>';
  const nameEl = el.querySelector(".peer-name");
  const adj = ADJECTIVE_LIST.find((a) => name.startsWith(a));
  const rest = adj ? name.slice(adj.length) : name;
  const numMatch = rest.match(/^(.*?)(\d+)$/);
  const lines = adj ? [adj] : [];
  if (numMatch) {
    lines.push(numMatch[1], numMatch[2]);
  } else {
    lines.push(rest);
  }
  lines.filter(Boolean).forEach((line, i) => {
    if (i > 0) nameEl.appendChild(document.createElement("br"));
    nameEl.appendChild(document.createTextNode(line));
  });
  el.addEventListener("click", () => openUploadSheet(id, name));
  field.appendChild(el);
  peerNodeEls.set(id, el);
}

function openUploadSheet(id, name) {
  activeTargetId = id;
  sheetToName.textContent = name;
  overlay.classList.add("open");
}

function closeUploadSheet() {
  overlay.classList.remove("open");
  activeTargetId = null;
}

sheetClose.addEventListener("click", closeUploadSheet);
overlay.addEventListener("click", (e) => {
  if (e.target === overlay) closeUploadSheet();
});

dropZone.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
  if (fileInput.files.length > 0) {
    sendFile(activeTargetId, fileInput.files[0]);
    closeUploadSheet();
    fileInput.value = "";
  }
});

dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files.length > 0) {
    sendFile(activeTargetId, e.dataTransfer.files[0]);
    closeUploadSheet();
  }
});

const connections = new Map();

function getOrCreateConnection(peerId, peerName) {
  if (connections.has(peerId)) return connections.get(peerId);

  const pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
  });

  const entry = { pc, dataChannel: null, peerName, incoming: null };
  connections.set(peerId, entry);

  pc.addEventListener("icecandidate", (event) => {
    if (event.candidate) {
      sendSignal(peerId, { kind: "ice", candidate: event.candidate });
    }
  });

  pc.addEventListener("datachannel", (event) => {
    entry.dataChannel = event.channel;
    setupDataChannel(entry, peerId);
  });

  return entry;
}

function sendSignal(to, payload) {
  ws.send(JSON.stringify({ type: "signal", to, payload }));
}

async function sendFile(peerId, file) {
  const peerName = peers.get(peerId)?.name || "端末";
  const entry = getOrCreateConnection(peerId, peerName);

  if (!entry.dataChannel) {
    const dc = entry.pc.createDataChannel("file");
    entry.dataChannel = dc;
    setupDataChannel(entry, peerId);
  }

  const startTransfer = () => {
    const card = createTransferCard(file.name, file.size, "送信中", true, file.type);
    attachPreview(card, file.name, file.type, file);
    beginSending(entry, file, card);
  };

  if (entry.dataChannel.readyState === "open") {
    startTransfer();
    return;
  }

  const offer = await entry.pc.createOffer();
  await entry.pc.setLocalDescription(offer);
  sendSignal(peerId, { kind: "offer", sdp: offer });

  entry.dataChannel.addEventListener("open", startTransfer, { once: true });
}

function beginSending(entry, file, card) {
  const dc = entry.dataChannel;
  const fill = card.querySelector(".progress-fill");
  dc.send(JSON.stringify({ meta: true, name: file.name, size: file.size, mime: file.type }));

  let offset = 0;
  const reader = new FileReader();

  function readSlice() {
    const slice = file.slice(offset, offset + CHUNK_SIZE);
    reader.readAsArrayBuffer(slice);
  }

  reader.addEventListener("load", () => {
    dc.send(reader.result);
    offset += reader.result.byteLength;
    const pct = Math.min(100, Math.round((offset / file.size) * 100));
    fill.style.width = pct + "%";
    if (offset < file.size) {
      if (dc.bufferedAmount > 8 * CHUNK_SIZE) {
        setTimeout(readSlice, 30);
      } else {
        readSlice();
      }
    } else {
      card.querySelector(".fmeta").textContent = "送信完了";
    }
  });

  readSlice();
}

async function handlePeerSignal(fromId, fromName, payload) {
  const entry = getOrCreateConnection(fromId, fromName);
  const pc = entry.pc;

  if (payload.kind === "offer") {
    await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal(fromId, { kind: "answer", sdp: answer });
  } else if (payload.kind === "answer") {
    await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
  } else if (payload.kind === "ice") {
    try {
      await pc.addIceCandidate(payload.candidate);
    } catch (err) {}
  }
}

function setupDataChannel(entry, peerId) {
  const dc = entry.dataChannel;
  dc.binaryType = "arraybuffer";

  dc.addEventListener("message", (event) => {
    if (typeof event.data === "string") {
      const meta = JSON.parse(event.data);
      if (meta.meta) {
        entry.incoming = {
          name: meta.name,
          size: meta.size,
          mime: meta.mime,
          chunks: [],
          received: 0,
          card: createTransferCard(meta.name, meta.size, `${entry.peerName}から受信中`, true, meta.mime),
        };
      }
      return;
    }
    const inc = entry.incoming;
    if (!inc) return;
    inc.chunks.push(event.data);
    inc.received += event.data.byteLength;
    const pct = Math.min(100, Math.round((inc.received / inc.size) * 100));
    inc.card.querySelector(".progress-fill").style.width = pct + "%";
    if (inc.received >= inc.size) {
      finalizeIncoming(inc, entry.peerName);
      entry.incoming = null;
    }
  });
}

function finalizeIncoming(inc, peerName) {
  const blob = new Blob(inc.chunks, { type: inc.mime || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const card = inc.card;
  attachPreview(card, inc.name, inc.mime, blob);
  card.querySelector(".fmeta").textContent = `${peerName}から受信完了`;
  const track = card.querySelector(".progress-track");
  if (track) track.remove();

  const dlBtn = document.createElement("button");
  dlBtn.className = "dl-btn";
  dlBtn.innerHTML = '<i class="fa-solid fa-download"></i> 保存する';
  dlBtn.addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = url;
    a.download = inc.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
  card.appendChild(dlBtn);
}

const IMAGE_EXTS = ["jpg", "jpeg", "png", "gif", "webp", "avif", "bmp", "svg", "heic", "heif"];
const VIDEO_EXTS = ["mp4", "mov", "webm", "m4v", "avi", "mkv", "ogv"];

function extOf(name) {
  const i = name.lastIndexOf(".");
  return i === -1 ? "" : name.slice(i + 1).toLowerCase();
}

function kindOf(name, mime) {
  const ext = extOf(name);
  if ((mime && mime.startsWith("image/")) || IMAGE_EXTS.includes(ext)) return "image";
  if ((mime && mime.startsWith("video/")) || VIDEO_EXTS.includes(ext)) return "video";
  return "file";
}

function faIconFor(name, mime) {
  const kind = kindOf(name, mime);
  const ext = extOf(name);
  if (kind === "image") return "fa-regular fa-image";
  if (kind === "video") return "fa-solid fa-film";
  if (ext === "pdf") return "fa-regular fa-file-pdf";
  if (["doc", "docx"].includes(ext)) return "fa-regular fa-file-word";
  if (["xls", "xlsx", "csv"].includes(ext)) return "fa-regular fa-file-excel";
  if (["ppt", "pptx", "key"].includes(ext)) return "fa-regular fa-file-powerpoint";
  if (["zip", "rar", "7z", "tar", "gz"].includes(ext)) return "fa-regular fa-file-zipper";
  if (["mp3", "wav", "m4a", "flac", "aac", "ogg"].includes(ext)) return "fa-regular fa-file-audio";
  if (["txt", "md", "rtf"].includes(ext)) return "fa-regular fa-file-lines";
  if (["js", "ts", "html", "css", "json", "py", "java", "c", "cpp", "go", "rs", "sh"].includes(ext)) return "fa-regular fa-file-code";
  return "fa-regular fa-file";
}

function setIcon(iconEl, name, mime) {
  iconEl.replaceChildren();
  const i = document.createElement("i");
  i.className = faIconFor(name, mime);
  iconEl.appendChild(i);
}

function attachPreview(card, name, mime, source) {
  const iconEl = card.querySelector(".transfer-icon");
  const kind = kindOf(name, mime);
  if (kind === "file") return null;

  const url = URL.createObjectURL(source);
  const fallback = () => setIcon(iconEl, name, mime);

  if (kind === "image") {
    const img = document.createElement("img");
    img.alt = "";
    img.addEventListener("load", () => {
      iconEl.replaceChildren(img);
    });
    img.addEventListener("error", fallback);
    img.src = url;
  } else {
    const video = document.createElement("video");
    video.muted = true;
    video.playsInline = true;
    video.preload = "metadata";
    video.addEventListener("loadeddata", () => {
      iconEl.replaceChildren(video);
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.innerHTML = '<i class="fa-solid fa-play"></i>';
      iconEl.appendChild(badge);
    });
    video.addEventListener("error", fallback);
    video.src = url + "#t=0.1";
  }
  return url;
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

function createTransferCard(name, size, statusLabel, withProgress, mime) {
  const card = document.createElement("div");
  card.className = "transfer-card";
  card.innerHTML = `
    <div class="transfer-icon"><i class="${faIconFor(name, mime)}"></i></div>
    <div class="transfer-info">
      <div class="fname">${escapeHtml(name)}</div>
      <div class="fmeta">${statusLabel} ・ ${formatSize(size)}</div>
      ${withProgress ? '<div class="progress-track"><div class="progress-fill"></div></div>' : ""}
    </div>
  `;
  logEl.prepend(card);
  return card;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

connect();
