<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quickdrop ― 同じ場所で、ファイルを渡す</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1512;
    --panel: #161F1B;
    --panel-raised: #1D2924;
    --accent: #7FE0B5;
    --accent-dim: #4E8F72;
    --text: #EAF2ED;
    --sub: #8FA69A;
    --warn: #E0947F;
    --line: #253128;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", sans-serif;
    height: 100%;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 28px 24px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }

  header p {
    margin: 0;
    color: var(--sub);
    font-size: 13px;
    line-height: 1.6;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--sub);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--warn);
    transition: background 0.4s ease;
  }

  .status-dot.connected {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .you-name {
    color: var(--accent);
    font-weight: 500;
  }

  main {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 60vh;
  }

  #field {
    position: relative;
    width: 100%;
    max-width: 560px;
    height: 420px;
  }

  .empty-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--sub);
    font-size: 14px;
    line-height: 1.9;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .peer-node {
    position: absolute;
    width: 108px;
    height: 108px;
    margin-left: -54px;
    margin-top: -54px;
    border-radius: 50%;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    animation: drift 6s ease-in-out infinite, fade-in 0.5s ease;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .peer-node:hover {
    transform: scale(1.08);
    border-color: var(--accent-dim);
    box-shadow: 0 0 24px rgba(127, 224, 181, 0.15);
  }

  .peer-node.leaving {
    animation: fade-out 0.4s ease forwards;
  }

  .peer-node .glow {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
  }

  .peer-node .peer-name {
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    padding: 0 10px;
  }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(0, -10px); }
  }

  .peer-node:hover { animation-play-state: paused; }

  @keyframes fade-in {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes fade-out {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(0.6); }
  }

  #log {
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
    padding: 0 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .log-title {
    font-size: 12px;
    color: var(--sub);
    margin: 4px 0;
  }

  .transfer-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: fade-in 0.4s ease;
  }

  .transfer-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--panel-raised);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .transfer-info {
    flex: 1;
    min-width: 0;
  }

  .transfer-info .fname {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .transfer-info .fmeta {
    font-size: 12px;
    color: var(--sub);
    margin-top: 2px;
  }

  .progress-track {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.15s ease;
  }

  .dl-btn {
    background: var(--accent);
    color: #0F1512;
    border: none;
    border-radius: 10px;
    padding: 9px 16px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: opacity 0.2s ease;
  }

  .dl-btn:hover { opacity: 0.85; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 21, 18, 0.72);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .sheet {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    padding: 24px 24px 32px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
    border-top: 1px solid var(--line);
  }

  .overlay.open .sheet {
    transform: translateY(0);
  }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 0 auto 18px;
  }

  .sheet h2 {
    font-size: 17px;
    margin: 0 0 4px;
    font-weight: 700;
  }

  .sheet .to-name {
    color: var(--accent);
  }

  .sheet p.desc {
    color: var(--sub);
    font-size: 13px;
    margin: 0 0 18px;
  }

  .drop-zone {
    border: 1.5px dashed var(--line);
    border-radius: 16px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent-dim);
    background: var(--panel-raised);
  }

  .drop-zone .dz-icon {
    font-size: 28px;
    margin-bottom: 8px;
  }

  .drop-zone .dz-text {
    font-size: 14px;
    color: var(--text);
  }

  .drop-zone .dz-sub {
    font-size: 12px;
    color: var(--sub);
    margin-top: 4px;
  }

  .sheet-close {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: none;
    color: var(--sub);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }

  input[type=file] { display: none; }

  @media (max-width: 480px) {
    #field { height: 340px; }
    .peer-node { width: 92px; height: 92px; margin-left: -46px; margin-top: -46px; }
  }
</style>
</head>
<body>

<header>
  <h1>Quickdrop</h1>
  <p>このページを開いている、同じネットワーク内の端末が浮かび上がります。選んで、そのままファイルを送れます。</p>
  <div class="status-row">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">接続しています…</span>
    <span>／ あなたはこの場では</span>
    <span class="you-name" id="youName">—</span>
  </div>
</header>

<main>
  <div id="field">
    <div class="empty-hint" id="emptyHint">まだ誰もいません。<br>同じWi-Fiの端末でこのページを開くと、ここに現れます。</div>
  </div>
</main>

<div id="log"></div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2><span class="to-name" id="sheetToName">端末</span>にファイルを送る</h2>
    <p class="desc">画像・動画・PDFなど、ファイルの種類は問いません。</p>
    <div class="drop-zone" id="dropZone">
      <div class="dz-icon">📤</div>
      <div class="dz-text">タップしてファイルを選ぶ</div>
      <div class="dz-sub">またはここにドラッグ＆ドロップ</div>
    </div>
    <input type="file" id="fileInput">
    <button class="sheet-close" id="sheetClose">閉じる</button>
  </div>
</div>

<script>
const SIGNALING_URL = (() => {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  return proto + "//YOUR-WORKER-SUBDOMAIN.workers.dev/ws";
})();

const CHUNK_SIZE = 16 * 1024;

let ws = null;
let myId = null;
let myName = null;
const peers = new Map();
const peerNodeEls = new Map();
let activeTargetId = null;

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const youNameEl = document.getElementById("youName");
const field = document.getElementById("field");
const emptyHint = document.getElementById("emptyHint");
const logEl = document.getElementById("log");
const overlay = document.getElementById("overlay");
const sheetToName = document.getElementById("sheetToName");
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const sheetClose = document.getElementById("sheetClose");

function connect() {
  ws = new WebSocket(SIGNALING_URL);

  ws.addEventListener("open", () => {
    statusDot.classList.add("connected");
    statusText.textContent = "接続中";
  });

  ws.addEventListener("close", () => {
    statusDot.classList.remove("connected");
    statusText.textContent = "切断されました。再接続しています…";
    setTimeout(connect, 2000);
  });

  ws.addEventListener("error", () => {
    ws.close();
  });

  ws.addEventListener("message", (event) => {
    const data = JSON.parse(event.data);
    handleSignalingMessage(data);
  });
}

function handleSignalingMessage(data) {
  if (data.type === "welcome") {
    myId = data.id;
    myName = data.name;
    youNameEl.textContent = myName;
  } else if (data.type === "peer-list") {
    data.peers.forEach((p) => addPeer(p.id, p.name));
  } else if (data.type === "peer-joined") {
    addPeer(data.id, data.name);
  } else if (data.type === "peer-left") {
    removePeer(data.id);
  } else if (data.type === "signal") {
    handlePeerSignal(data.from, data.fromName, data.payload);
  }
}

function addPeer(id, name) {
  if (peers.has(id)) return;
  peers.set(id, { id, name });
  renderPeerNode(id, name);
  emptyHint.style.display = "none";
}

function removePeer(id) {
  peers.delete(id);
  const el = peerNodeEls.get(id);
  if (el) {
    el.classList.add("leaving");
    setTimeout(() => el.remove(), 400);
    peerNodeEls.delete(id);
  }
  if (peers.size === 0) {
    emptyHint.style.display = "flex";
  }
  const conn = connections.get(id);
  if (conn) {
    conn.pc.close();
    connections.delete(id);
  }
}

function renderPeerNode(id, name) {
  const el = document.createElement("div");
  el.className = "peer-node";
  const angle = Math.random() * Math.PI * 2;
  const radius = 100 + Math.random() * 70;
  const cx = field.clientWidth / 2 || 280;
  const cy = field.clientHeight / 2 || 210;
  const x = cx + Math.cos(angle) * radius;
  const y = cy + Math.sin(angle) * radius;
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.animationDelay = (Math.random() * 3) + "s";
  el.innerHTML = '<div class="glow"></div><div class="peer-name"></div>';
  el.querySelector(".peer-name").textContent = name;
  el.addEventListener("click", () => openUploadSheet(id, name));
  field.appendChild(el);
  peerNodeEls.set(id, el);
}

function openUploadSheet(id, name) {
  activeTargetId = id;
  sheetToName.textContent = name;
  overlay.classList.add("open");
}

function closeUploadSheet() {
  overlay.classList.remove("open");
  activeTargetId = null;
}

sheetClose.addEventListener("click", closeUploadSheet);
overlay.addEventListener("click", (e) => {
  if (e.target === overlay) closeUploadSheet();
});

dropZone.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
  if (fileInput.files.length > 0) {
    sendFile(activeTargetId, fileInput.files[0]);
    closeUploadSheet();
    fileInput.value = "";
  }
});

dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files.length > 0) {
    sendFile(activeTargetId, e.dataTransfer.files[0]);
    closeUploadSheet();
  }
});

const connections = new Map();

function getOrCreateConnection(peerId, peerName) {
  if (connections.has(peerId)) return connections.get(peerId);

  const pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
  });

  const entry = { pc, dataChannel: null, peerName, incoming: null };
  connections.set(peerId, entry);

  pc.addEventListener("icecandidate", (event) => {
    if (event.candidate) {
      sendSignal(peerId, { kind: "ice", candidate: event.candidate });
    }
  });

  pc.addEventListener("datachannel", (event) => {
    entry.dataChannel = event.channel;
    setupDataChannel(entry, peerId);
  });

  return entry;
}

function sendSignal(to, payload) {
  ws.send(JSON.stringify({ type: "signal", to, payload }));
}

async function sendFile(peerId, file) {
  const peerName = peers.get(peerId)?.name || "端末";
  const entry = getOrCreateConnection(peerId, peerName);

  if (!entry.dataChannel) {
    const dc = entry.pc.createDataChannel("file");
    entry.dataChannel = dc;
    setupDataChannel(entry, peerId);
  }

  const startTransfer = () => {
    const card = createTransferCard(file.name, file.size, "送信中", true);
    beginSending(entry, file, card);
  };

  if (entry.dataChannel.readyState === "open") {
    startTransfer();
    return;
  }

  const offer = await entry.pc.createOffer();
  await entry.pc.setLocalDescription(offer);
  sendSignal(peerId, { kind: "offer", sdp: offer });

  entry.dataChannel.addEventListener("open", startTransfer, { once: true });
}

function beginSending(entry, file, card) {
  const dc = entry.dataChannel;
  const fill = card.querySelector(".progress-fill");
  dc.send(JSON.stringify({ meta: true, name: file.name, size: file.size, mime: file.type }));

  let offset = 0;
  const reader = new FileReader();

  function readSlice() {
    const slice = file.slice(offset, offset + CHUNK_SIZE);
    reader.readAsArrayBuffer(slice);
  }

  reader.addEventListener("load", () => {
    dc.send(reader.result);
    offset += reader.result.byteLength;
    const pct = Math.min(100, Math.round((offset / file.size) * 100));
    fill.style.width = pct + "%";
    if (offset < file.size) {
      if (dc.bufferedAmount > 8 * CHUNK_SIZE) {
        setTimeout(readSlice, 30);
      } else {
        readSlice();
      }
    } else {
      card.querySelector(".fmeta").textContent = "送信完了";
    }
  });

  readSlice();
}

async function handlePeerSignal(fromId, fromName, payload) {
  const entry = getOrCreateConnection(fromId, fromName);
  const pc = entry.pc;

  if (payload.kind === "offer") {
    await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal(fromId, { kind: "answer", sdp: answer });
  } else if (payload.kind === "answer") {
    await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
  } else if (payload.kind === "ice") {
    try {
      await pc.addIceCandidate(payload.candidate);
    } catch (err) {}
  }
}

function setupDataChannel(entry, peerId) {
  const dc = entry.dataChannel;
  dc.binaryType = "arraybuffer";

  dc.addEventListener("message", (event) => {
    if (typeof event.data === "string") {
      const meta = JSON.parse(event.data);
      if (meta.meta) {
        entry.incoming = {
          name: meta.name,
          size: meta.size,
          mime: meta.mime,
          chunks: [],
          received: 0,
          card: createTransferCard(meta.name, meta.size, `${entry.peerName}から受信中`, true),
        };
      }
      return;
    }
    const inc = entry.incoming;
    if (!inc) return;
    inc.chunks.push(event.data);
    inc.received += event.data.byteLength;
    const pct = Math.min(100, Math.round((inc.received / inc.size) * 100));
    inc.card.querySelector(".progress-fill").style.width = pct + "%";
    if (inc.received >= inc.size) {
      finalizeIncoming(inc, entry.peerName);
      entry.incoming = null;
    }
  });
}

function finalizeIncoming(inc, peerName) {
  const blob = new Blob(inc.chunks, { type: inc.mime || "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const card = inc.card;
  card.querySelector(".fmeta").textContent = `${peerName}から受信完了`;
  const track = card.querySelector(".progress-track");
  if (track) track.remove();

  const dlBtn = document.createElement("button");
  dlBtn.className = "dl-btn";
  dlBtn.textContent = "保存する";
  dlBtn.addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = url;
    a.download = inc.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
  card.appendChild(dlBtn);
}

function iconForMime(name) {
  const ext = name.split(".").pop().toLowerCase();
  if (["jpg", "jpeg", "png", "gif", "webp", "heic"].includes(ext)) return "🖼️";
  if (["mp4", "mov", "webm", "avi"].includes(ext)) return "🎞️";
  if (ext === "pdf") return "📄";
  return "📦";
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

function createTransferCard(name, size, statusLabel, withProgress) {
  const card = document.createElement("div");
  card.className = "transfer-card";
  card.innerHTML = `
    <div class="transfer-icon">${iconForMime(name)}</div>
    <div class="transfer-info">
      <div class="fname">${escapeHtml(name)}</div>
      <div class="fmeta">${statusLabel} ・ ${formatSize(size)}</div>
      ${withProgress ? '<div class="progress-track"><div class="progress-fill"></div></div>' : ""}
    </div>
  `;
  logEl.prepend(card);
  return card;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

connect();
</script>
</body>
</html>
